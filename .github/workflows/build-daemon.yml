name: Build NexusRoot Daemon

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust_target: aarch64-linux-android
            android_abi: arm64-v8a
          - rust_target: armv7-linux-androideabi
            android_abi: armeabi-v7a
          - rust_target: x86_64-linux-android
            android_abi: x86_64
          - rust_target: i686-linux-android
            android_abi: x86

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build daemon
        run: |
          cargo ndk -t ${{ matrix.rust_target }} build --release
          mkdir -p dist/${{ matrix.android_abi }}
          cp target/${{ matrix.rust_target }}/release/nexusrootd dist/${{ matrix.android_abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusrootd-${{ matrix.android_abi }}
          path: dist/${{ matrix.android_abi }}/*
